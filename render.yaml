services:
  - type: web
    name: tekstom-utscraber-api
    runtime: docker
    branch: main
    plan: free
    autoDeployTrigger: commit
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: ALLOWED_ORIGINS
        value: https://weij33t.github.io
      - key: PYTHONUNBUFFERED
        value: '1'
